name: CI

# Corrige le finding Critique de l'audit : jusqu'ici aucun workflow ne lançait
# `pytest`, et 55 des 128 tests (toute l'authentification, tout le frontend, toute
# la persistance) étaient skippés faute de TEST_DATABASE_URL. Le vert affiché
# localement était un faux vert. Ce job fournit un vrai Postgres, y applique les
# migrations, et échoue si le nombre de tests skippés dépasse le budget attendu.

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fakenews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/fakenews_test
      PSQL_URL: postgresql://postgres:postgres@localhost:5432/fakenews_test
      # Budget de skips toléré. Les tests contre une vraie base ne doivent plus
      # jamais être skippés ici ; seuls des skips explicitement justifiés (aucun
      # aujourd'hui) peuvent exister. Toute hausse est une régression à expliquer.
      SKIPS_MAX: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Le modèle NER est épinglé (cf. audit, Supply Chain) : une version flottante
      # ferait varier la sortie de US-04 évaluateur sans aucun commit.
      - run: pip install "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      - name: Appliquer les migrations à la base de test
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "-> $migration"
            psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Tests
        run: pytest -q --junit-xml=rapport.xml

      - name: Vérifier qu'aucun test n'a été silencieusement skippé
        if: always()
        run: |
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET

          suite = ET.parse("rapport.xml").getroot().find("testsuite")
          skips, total = int(suite.get("skipped")), int(suite.get("tests"))
          budget = int(os.environ["SKIPS_MAX"])
          print(f"{skips} skip(s) sur {total} test(s) — budget : {budget}")
          if skips > budget:
              sys.exit(
                  f"ÉCHEC : {skips} test(s) skippé(s) pour un budget de {budget}. "
                  "Un test skippé en CI est un test qui n'existe pas."
              )
          PY

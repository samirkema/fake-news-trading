name: Pipeline hebdomadaire

"on":
  # Projet en pause : déclenchement automatique désactivé pour ne pas relancer de
  # scraping/notation (et donc de consommation de la clé Anthropic) sans action
  # explicite. Réactiver en décommentant le bloc schedule ci-dessous.
  # schedule:
  #   - cron: "0 6 * * 1" # tous les lundis à 06:00 UTC
  workflow_dispatch: {} # déclenchement manuel possible depuis GitHub

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Le raisonnement était fait sans la borne : run_evaluateur.py justifie son
    # plafond d'articles par « exposé au timeout GitHub Actions », mais aucun
    # timeout n'était déclaré — le défaut de la plateforme est 6 h, soit 6 h de
    # runner consommées avant qu'un blocage ne se voie (cf. audit phase 10).
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Modèle spaCy pour l'extraction d'entreprises (US-04 évaluateur, source
      # primaire) — pas dans requirements.txt (les modèles spaCy ne s'installent pas
      # via un pip install classique depuis PyPI).
      #
      # Version ÉPINGLÉE (cf. audit, Supply Chain) : `spacy download` prenait la
      # dernière version compatible, donc la sortie de US-04 pouvait changer d'un
      # run à l'autre sans le moindre commit.
      - run: pip install "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      # Scraper (US-06 scraper) : RSS + Reddit. Identifiants Reddit scopés à ce seul
      # step (cf. audit de suivi) — évaluateur et contextualiseur n'en ont pas besoin.
      # Si absents/invalides, la collecte Reddit dégrade proprement (cf. reddit.py) :
      # ne bloque plus les steps suivants.
      - run: python -m fakenews.scraper.run_scraper
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

      # Évaluateur (US-08, US-01 réputation, US-03 fact-checking, US-04 source
      # primaire, US-05 style, US-07 LLM bootstrap — cf. doc/plan_implementation.md
      # "État d'avancement" pour les signaux restants).
      - run: python -m fakenews.evaluateur.run_evaluateur
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_FACT_CHECK_API_KEY: ${{ secrets.GOOGLE_FACT_CHECK_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}

      # Contextualiseur : sélectionne et génère la mise en contexte (US-01, US-02,
      # US-03, US-04). Dégrade proprement (sélection journalisée, rien généré) si
      # ANTHROPIC_API_KEY est absente.
      - run: python -m fakenews.contextualiseur.run_contextualiseur
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Le frontend n'est pas dans ce job : consulté à la demande sur Vercel, qui lit
      # directement Supabase (cf. doc/architecture.md, doc/plan_implementation.md Phase 5).

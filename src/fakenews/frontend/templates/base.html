<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fake News — Détection{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; line-height: 1.5; }
    h1 a { color: inherit; text-decoration: none; }
    .avertissement { background: #fff3cd; border: 1px solid #ffe69c; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
    .score { font-weight: bold; }
    .exclu { color: #888; font-style: italic; }
    form.filtres { display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; margin-bottom: 1rem; }
    form.filtres label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 0.25rem; }
    a { color: #1a56db; }
  </style>
</head>
<body>
  <h1><a href="/">Fake News — Détection</a></h1>
  <div class="avertissement">{{ avertissement }}</div>
  {% block content %}{% endblock %}
</body>
</html>

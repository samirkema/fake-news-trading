<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Fake News Détection</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 4rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.2rem; }
    form { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem; }
    input[type="password"] { padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 0.6rem; font-size: 1rem; border: none; border-radius: 6px; background: #1a56db; color: white; cursor: pointer; }
    button:hover { background: #143f9e; }
    .erreur { color: #b91c1c; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Fake News — Détection</h1>
  <p>Accès protégé — mot de passe requis.</p>
  {% if erreur %}<p class="erreur">{{ erreur }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="mot_de_passe" placeholder="Mot de passe" autofocus required>
    <button type="submit">Se connecter</button>
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — fakenewstrackingbase</title>
  <style>
    :root { --papier:#fbf8f3; --encre:#1b1b1b; --gris:#5c5c5c; --filet:#d9d4ca; --accent:#b0121b; --accent-fonce:#7e0d14; --erreur:#9b1c1c; }
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 4rem auto; padding: 0 1rem; color: var(--encre); background: var(--papier); }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.6rem; border-top: 4px solid var(--encre); border-bottom: 1px solid var(--encre); padding: 0.6rem 0; text-align: center; }
    a { color: var(--accent); }
    form { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem; }
    input[type="text"], input[type="password"] { padding: 0.5rem; font-size: 1rem; border: 1px solid var(--filet); border-radius: 2px; background: #fff; }
    button { padding: 0.6rem; font-size: 1rem; border: none; border-radius: 2px; background: var(--accent); color: white; cursor: pointer; }
    button:hover { background: var(--accent-fonce); }
    :focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; }
    .erreur { color: var(--erreur); font-size: 0.9rem; }
    .aide { margin-top: 2rem; font-size: 0.85rem; color: var(--gris); }
  </style>
</head>
<body>
  <h1>fakenewstrackingbase</h1>
  <p>Accès protégé — pseudo et mot de passe requis.</p>
  {% if erreur %}<p class="erreur" role="alert" id="erreur-login">{{ erreur }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="champ-pseudo">Pseudo</label>
    <input type="text" id="champ-pseudo" name="pseudo" placeholder="Pseudo" autofocus required
           autocapitalize="none" autocorrect="off" spellcheck="false"
           pattern="[A-Za-z0-9._-]{1,64}" maxlength="64"
           {% if erreur %}aria-describedby="erreur-login"{% endif %}>
    <label for="champ-mot-de-passe">Mot de passe</label>
    <input type="password" id="champ-mot-de-passe" name="mot_de_passe" placeholder="Mot de passe" required
           {% if erreur %}aria-describedby="erreur-login"{% endif %}>
    <button type="submit">Se connecter</button>
  </form>
  <p class="aide">
    Des idées pour améliorer le site, un bug à signaler ? Écrivez-nous à
    <a href="mailto:fakenewstrackingbase@gmail.com">fakenewstrackingbase@gmail.com</a>.
  </p>
</body>
</html>
